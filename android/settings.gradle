// RFP Manager for Android: a native app (WebView screens from the website, Firebase push notifications,
// the camera, downloads, sharing and in-app updates).
pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = 'RFPManager'
include ':app'
