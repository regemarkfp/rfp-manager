<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RFP Manager Preview</title>
  <!-- Preview channel monitor. Same as output.html?ch=pvw&hud=1&bg=checker (all options still work). -->
  <script>window.OUTPUT_DEFAULTS = { ch: 'pvw', hud: '1', bg: 'checker', title: 'CricketCG Preview' };</script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
    #stage iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; background: transparent; pointer-events: none; }
    body.bg-black { background: #000; } body.bg-green { background: #00b140; } body.bg-blue { background: #0047bb; }
    body.bg-checker #stage { background: repeating-conic-gradient(#2a2f37 0 25%, #1f232a 0 50%) 0 0 / 40px 40px; }
    #hud { position: absolute; left: 24px; top: 20px; z-index: 100000; font: 700 22px/1.3 "Segoe UI", Arial, sans-serif; color: #fff; pointer-events: none; display: none; }
    body.hud #hud { display: block; }
    #hud .tag { display: inline-block; padding: 4px 14px; border-radius: 6px; letter-spacing: .12em; background: #444; }
    #hud .tag.pgm { background: #d92d34; } #hud .tag.pvw { background: #1f8a3c; }
    #hud .tag.off { background: #6b2226; }
    #hud .layers { margin-top: 8px; font: 600 16px/1.45 Consolas, monospace; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; }
    #hud .layers:empty { display: none; }
    #tally { position: absolute; inset: 0; border: 6px solid transparent; z-index: 99999; pointer-events: none; display: none; }
    body.hud #tally { display: block; }
    #tally.on { border-color: #d92d34; } #tally.on.pv { border-color: #1f8a3c; }
    #safe { position: absolute; inset: 0; z-index: 99998; pointer-events: none; display: none; }
    body.safe #safe { display: block; }
    #safe i { position: absolute; border: 2px dashed rgba(255,255,255,.55); }
    #safe i.a { left: 5%; top: 5%; right: 5%; bottom: 5%; }
    #safe i.t { left: 10%; top: 10%; right: 10%; bottom: 10%; border-color: rgba(255,210,0,.6); }
    #safe i.c { left: calc(50% - 30px); top: calc(50% - 1px); width: 60px; height: 0; border-width: 1px 0 0; border-style: solid; }
    #safe i.v { left: calc(50% - 1px); top: calc(50% - 30px); width: 0; height: 60px; border-width: 0 0 0 1px; border-style: solid; }
  </style>
</head>
<body>
<div id="stage">
  <div id="safe"><i class="a"></i><i class="t"></i><i class="c"></i><i class="v"></i></div>
  <div id="tally"></div>
  <div id="hud"><span class="tag" id="tag">PREVIEW</span><div class="layers" id="layers"></div></div>
</div>
<script src="js/common.js"></script>
<script src="js/output.js"></script>
</body>
</html>
