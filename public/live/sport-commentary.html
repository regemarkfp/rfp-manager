<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/icons/favicon-64.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <title>RFP Manager Sport Commentary</title>
  <style>
    :root { --bg:#070b12; --panel:#0f1622; --line:#223049; --text:#eef3fa; --muted:#8fa0b8; --gold:#f4c20d; --cyan:#39c5cf; --green:#2ecc71; --red:#ff4d55;
            --font:"Barlow Condensed","Roboto Condensed","Arial Narrow","Segoe UI",Arial,sans-serif; }
    html, body { margin:0; height:100%; background:#000; overflow:hidden; }
    * { box-sizing:border-box; }
    #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; background:var(--bg); color:var(--text); font-family:var(--font);
             display:grid; grid-template-rows:236px 1fr 236px; gap:14px; padding:14px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 18px; min-height:0; overflow:hidden; position:relative; }
    .ttl { font-size:18px; letter-spacing:.18em; color:var(--muted); font-weight:700; text-transform:uppercase; margin-bottom:8px; display:flex; gap:12px; }
    .ttl .sp { flex:1; }
    .up { text-transform:uppercase; } .num { font-variant-numeric:tabular-nums; } .muted { color:var(--muted); }
    #head { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:30px; }
    .tm { display:flex; align-items:center; gap:18px; font-size:52px; font-weight:800; }
    .tm.b { justify-content:flex-end; }
    .tm .sw { width:18px; height:110px; border-radius:4px; }
    .tm .srv { color:var(--gold); font-size:36px; }
    .mid { text-align:center; }
    .score { font-size:100px; font-weight:800; line-height:.95; }
    .score span { color:var(--muted); padding:0 18px; }
    .per { font-size:30px; font-weight:800; letter-spacing:.1em; color:var(--gold); }
    .clk { font-size:54px; font-weight:800; margin-left:18px; color:var(--cyan); }
    .status { font-size:26px; font-weight:700; color:var(--muted); letter-spacing:.04em; }
    .flag { display:inline-block; background:var(--gold); color:#111; font-size:26px; font-weight:800; padding:1px 14px; border-radius:6px; margin-top:2px; }
    #mid { display:grid; grid-template-columns:1.05fr 1fr .95fr; gap:14px; min-height:0; }
    .col { display:flex; flex-direction:column; gap:14px; min-height:0; }
    table { width:100%; border-collapse:collapse; font-size:30px; }
    th { font-size:17px; letter-spacing:.12em; color:var(--muted); font-weight:700; padding:3px 8px; text-align:center; }
    td { text-align:center; padding:5px 8px; border-bottom:1px solid #1a2436; font-variant-numeric:tabular-nums; font-weight:700; }
    td.l, th.l { text-align:left; }
    td.t { color:var(--gold); }
    .ev { display:grid; grid-template-columns:90px 14px 1fr; gap:12px; align-items:center; padding:6px 0; border-bottom:1px solid #1a2436; font-size:25px; font-weight:700; }
    .ev .t { color:var(--gold); font-variant-numeric:tabular-nums; }
    .ev .c { width:14px; height:32px; border-radius:3px; }
    .big { font-size:44px; font-weight:800; }
    .kv { display:flex; justify-content:space-between; font-size:26px; padding:4px 0; border-bottom:1px solid #1a2436; }
    .kv span { color:var(--muted); font-size:20px; letter-spacing:.08em; }
    #reel { position:relative; flex:1; overflow:hidden; border-radius:8px; background:linear-gradient(180deg,#0b111b,#18243a 50%,#0b111b); border:2px solid var(--gold); }
    #reel .strip { position:absolute; left:0; right:0; top:0; transition:transform .9s cubic-bezier(.3,1.4,.4,1); }
    #reel .card { height:var(--h); display:flex; flex-direction:column; justify-content:center; padding:10px 26px; }
    #reel .cat { font-size:20px; letter-spacing:.2em; color:var(--gold); font-weight:800; }
    #reel .bigt { font-size:58px; font-weight:800; line-height:1.05; margin:6px 0; }
    #reel .txt { font-size:28px; font-weight:600; line-height:1.15; }
    .st { display:grid; grid-template-columns:150px 1fr 150px; align-items:center; gap:14px; margin:4px 0; }
    .st .v { font-size:28px; font-weight:800; text-align:center; }
    .st .lbl { text-align:center; font-size:16px; letter-spacing:.14em; color:var(--muted); font-weight:700; margin-bottom:3px; }
    .st .bars { display:flex; height:12px; border-radius:6px; overflow:hidden; background:#1d2a40; }
    .st .bars i { display:block; height:100%; }
    #bot .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:4px 40px; }
    .bases { display:flex; gap:10px; justify-content:center; align-items:center; margin:10px 0; }
    .bases i { width:40px; height:40px; transform:rotate(45deg); border:3px solid var(--muted); display:inline-block; }
    .bases i.on { background:var(--gold); border-color:var(--gold); }
    #offline { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.7); font-size:48px; font-weight:800; color:var(--red); z-index:9; }
  </style>
  <link rel="stylesheet" href="css/narrow-stage.css">
</head>
<body>
<div id="stage">
  <div class="panel" id="head"></div>
  <div id="mid">
    <div class="col"><div class="panel" id="left" style="flex:1"></div></div>
    <div class="col"><div class="panel" id="timeline" style="flex:1"></div></div>
    <div class="col"><div class="panel" style="flex:1;display:flex;flex-direction:column"><div class="ttl">Fruit machine <span class="sp"></span><span id="reel-count" class="muted"></span></div><div id="reel"><div class="strip" id="strip"></div></div></div></div>
  </div>
  <div class="panel" id="bot"></div>
  <div id="offline">SERVER OFFLINE – RECONNECTING…</div>
</div>
<script src="js/common.js"></script>
<script src="/shared/sports.js"></script>
<script src="js/sportcomm.js"></script>
<script>
  // RFP Manager: a monitor that follows the match on air switches screen when the sport changes.
  if (/[?&]auto=1/.test(location.search)) CG.on('state', function (s) { if ((s.mode === 'sport' ? 'sport' : 'cricket') !== 'sport') location.replace('commentary.html' + (CG.query ? CG.query + '&auto=1' : '?auto=1')); });
</script>
<script src="/shared/colorpicker.js"></script>
</body>
</html>
