<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/icons/favicon-64.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RFP Manager Sports Scorer</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .board { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; }
    .board .tm { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 800; }
    .board .tm.b { justify-content: flex-end; }
    .board .tm .sw { width: 14px; height: 40px; border-radius: 3px; }
    .board .sc { font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; line-height: 1; }
    .board .sc span { color: var(--muted); padding: 0 12px; }
    .mid { text-align: center; }
    .mid .per { color: var(--amber); font-weight: 800; letter-spacing: .1em; }
    .mid .st { color: var(--muted); font-weight: 600; margin-top: 4px; }
    .clock { font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; line-height: 1; }
    .clock.run { color: var(--accent); }
    .shotclock { font-size: 40px; font-weight: 800; color: #ff9b9e; font-variant-numeric: tabular-nums; }
    .actgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .actgrid .btn { padding: 12px 6px; font-size: 15px; white-space: normal; }
    .actgrid .btn.big { font-size: 20px; padding: 18px 6px; }
    .teamcol h4 .sw { width: 10px; height: 16px; border-radius: 2px; display: inline-block; }
    .bigpt { height: 110px; font-size: 30px; font-weight: 800; }
    .ptsbox { display: flex; justify-content: center; gap: 30px; font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .ptsbox small { font-size: 18px; color: var(--muted); display: block; text-align: center; letter-spacing: .1em; }
    .srvdot { color: var(--amber); }
    table.t td input { padding: 3px 6px; }
    .diamond { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 6px; justify-content: center; }
    .diamond .btn { width: 44px; height: 44px; padding: 0; transform: rotate(45deg); }
    .diamond .btn span { display: block; transform: rotate(-45deg); }
    .diamond .btn.on { background: var(--amber); border-color: var(--amber); color: #111; }
    .count { font-size: 40px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
    .outs i { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line2); margin: 0 3px; }
    .outs i.on { background: var(--red); border-color: var(--red); }
    .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
    .pgrid .btn { text-align: left; white-space: normal; }
    .pgrid .btn b { color: var(--amber); margin-right: 6px; }
    .statcat { margin-bottom: 8px; } .statcat > span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .statgrid { display: flex; flex-wrap: wrap; gap: 6px; } .statgrid.big { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } .statgrid.big .btn { padding: 14px 8px; white-space: normal; }
    .statgrid .btn b { color: var(--accent); margin-left: 4px; }
    .fe-name { font-size: 30px; font-weight: 800; }
    .fe-chips { display: flex; gap: 4px; flex-wrap: wrap; }
    .att { display: inline-block; min-width: 38px; text-align: center; padding: 3px 6px; border-radius: 5px; background: var(--panel2); border: 1px solid var(--line2); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px; }
    .att.x { color: var(--red); border-color: var(--red); } .att.p { color: var(--muted); } .att.ok { color: var(--accent); }
    .btn.big { font-size: 18px; padding: 12px 18px; }
    table.t tr.out td { opacity: .55; }
    /* tap scorer (timed team sports) */
    .lg { max-width: 980px; margin: 0 auto; }
    .lgbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
    .lgbar .btn.ghost { font-weight: 700; letter-spacing: .04em; }
    .lgph { font-weight: 800; letter-spacing: .04em; min-width: 150px; }
    .lghead { text-align: center; padding: 10px 0 6px; }
    .lghead .per { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .1em; }
    .lgsc { display: grid; grid-template-columns: 1fr auto auto 1fr; align-items: center; gap: 14px; }
    .lgsc .tm { display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-size: 22px; font-style: italic; }
    .lgsc .tm.b { justify-content: flex-start; }
    .lgsc .num { font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 1.4em; }
    .lgfields { display: flex; justify-content: center; gap: 24px; margin-top: 6px; flex-wrap: wrap; }
    .lgfield { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
    .lgfield b { color: var(--text); }
    .lgclock { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 6px 0 12px; flex-wrap: wrap; }
    .lgclock .btn.ghost { width: 46px; height: 46px; font-size: 18px; padding: 0; background: var(--panel2); }
    .lgclock .clock { font-size: 34px; background: var(--panel2); border-radius: 8px; padding: 4px 14px; min-width: 120px; }
    .lggrid { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .lgrow { display: grid; grid-template-columns: 1fr 34px 1fr; align-items: stretch; border-top: 1px solid var(--line); }
    .lgrow:first-child { border-top: 0; }
    .lgs { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px; min-height: 58px; font-weight: 700; font-size: 14px; letter-spacing: .03em; }
    .lgs:hover { background: var(--panel2); } .lgs:active { filter: brightness(1.3); }
    .lgs[disabled] { opacity: .5; cursor: default; }
    .lgs .lab small { margin-left: 6px; color: var(--muted); font-weight: 600; }
    .lgs .n { font-size: 40px; font-weight: 800; font-style: italic; opacity: .5; font-variant-numeric: tabular-nums; line-height: 1; }
    .lgs.a .n { color: color-mix(in srgb, var(--ca) 65%, #fff); } .lgs.b .n { color: color-mix(in srgb, var(--cb) 65%, #fff); }
    .lu input:not([type=radio]) { background: var(--panel2); color: var(--text); border: 1px solid var(--line2); border-radius: 6px; padding: 4px 6px; }
    .lgrow.big .lgs { min-height: 72px; font-size: 16px; } .lgrow.big .lgs .n { font-size: 48px; }
    .lgmid { align-self: center; justify-self: center; width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(90deg, var(--ca) 0 50%, var(--cb) 50% 100%); opacity: .85; box-shadow: inset 0 0 0 3px var(--panel); }
    .lgstats { margin-top: 14px; }
    .lgcat { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin: 12px 4px 6px; }
    .lgstats .lgs { min-height: 44px; font-size: 13px; } .lgstats .lgs .n { font-size: 26px; }
    .lgshare { gap: 6px; margin: 4px; } .lgshare > span { min-width: 90px; }
    .lgtabs { display: flex; gap: 6px; margin-bottom: 8px; }
    .pgrid .btn small { display: block; color: var(--muted); font-size: 11px; }
    .hist td { vertical-align: middle; } .hist .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
    .hist .tag.on { color: var(--amber); }
    @media (max-width: 700px) {
      .lgsc .num { font-size: 40px; } .lgsc .tm { font-size: 16px; gap: 6px; }
      .lgs { padding: 0 10px; font-size: 12px; min-height: 52px; } .lgs .n { font-size: 30px; }
      .lgph { min-width: 0; }
    }
    @media (max-width: 700px) {
      .board { grid-template-columns: 1fr auto 1fr; gap: 8px; }
      .board .tm { font-size: 17px; gap: 6px; } .board .tm .sw { width: 8px; height: 28px; }
      .board .sc { font-size: 40px; } .board .sc span { padding: 0 6px; }
      .clock { font-size: 44px; } .shotclock { font-size: 30px; }
      .actgrid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; }
      .actgrid .btn { font-size: 14px; padding: 12px 4px; } .actgrid .btn.big { font-size: 18px; padding: 16px 4px; }
      .bigpt { height: 84px; font-size: 24px; } .ptsbox { font-size: 44px; gap: 16px; }
      .pgrid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">RFP Manager<small>Scorer</small></div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-page="score">Score</button>
      <button class="tab" data-page="setup">Setup</button>
      <button class="tab" data-page="timeline">History</button>
      <button class="tab" data-page="entry">Stats entry</button>
      <button class="tab" data-page="stats">Stats</button>
      <button class="tab" data-page="timing" id="tab-timing" hidden>Timing</button>
    </nav>
    <div class="matchline" id="matchline"></div>
    <div class="pills">
      <a class="pill" href="/" title="Back to RFP Manager">RFP MANAGER</a>
      <button class="btn sm" id="btn-mode" title="Make this the live event for graphics">MAKE LIVE EVENT</button>
      <a class="pill" href="control.html" title="Open graphics control">CONTROL ↗</a>
      <a class="pill" href="sport-commentary.html" target="_blank" title="Commentator screen">COMMS ↗</a>
      <span class="pill" id="pill-users">–</span>
      <span class="pill" id="pill-caspar">CASPAR</span>
      <span class="pill bad" id="pill-server">SERVER</span>
    </div>
  </header>
  <main>
    <section class="page active" id="page-score"><div id="score-root"></div></section>
    <section class="page" id="page-setup"><div id="setup-root"></div></section>
    <section class="page" id="page-timeline"><div class="panel"><h4>History <span class="sp"></span><button class="btn sm primary" id="btn-addev" hidden>+ Add event</button><button class="btn sm" id="btn-note">+ Note</button></h4><table class="t" id="tl"></table></div></section>
    <section class="page" id="page-entry"><div id="entry-root"></div></section>
    <section class="page" id="page-timing"><div id="timing-root"></div></section>
    <section class="page" id="page-stats"><div class="grid cols-2"><div class="panel"><h4>Team stats <span class="sp"></span><button class="btn sm" id="stats-export">Export CSV</button></h4><table class="t" id="tstats"></table></div><div class="panel" style="overflow:auto"><h4>Players</h4><table class="t" id="pstats"></table></div></div></section>
  </main>
</div>
<script src="js/common.js"></script>
<script src="/shared/sports.js"></script>
<script src="/shared/athletics.js"></script>
<script src="js/timing-ui.js"></script>
<script src="js/sportscorer.js"></script>
<script src="js/actions.js"></script>
<script src="js/padkit.js"></script>
<script src="/shared/tidy.js"></script>
<script src="/shared/colorpicker.js"></script>
</body>
</html>
