<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>RegemarkFP · Universe</title>
  <link rel="icon" type="image/png" href="/icons/favicon-64.png">
  <style>
    :root { --bg: #0f0f0f; --card: #1a1a1a; --line: #2c2c2c; --txt: #ececec; --dim: #9a9a9a; --acc: #00ff82; --bad: #ff5c5c; --warn: #ffb648; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--txt); font: 15px/1.45 "Segoe UI", Roboto, Arial, sans-serif; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
    header img { height: 30px; }
    header .grow { flex: 1; font-weight: 600; }
    main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 22px; margin: 0 0 14px; } h2 { font-size: 17px; margin: 0 0 12px; }
    .card { background: var(--card); border: 1px solid var(--line); padding: 16px 18px; margin-bottom: 16px; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
    .tile { background: #222; padding: 10px 14px; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
    .tile b { display: block; font-size: 20px; } .tile span { color: var(--dim); font-size: 13px; }
    .ok { color: var(--acc); } .bad { color: var(--bad); } .warn { color: var(--warn); } .dim { color: var(--dim); } .small { font-size: 13px; }
    input { width: 100%; padding: 10px 12px; margin: 4px 0 12px; background: #111; color: var(--txt); border: 1px solid var(--line); font: inherit; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
    button, .btn { display: inline-block; padding: 9px 20px; background: var(--acc); color: #000; border: 0; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
    button.ghost, .btn.ghost { background: #2a2a2a; color: var(--txt); }
    button:disabled { opacity: .5; }
    .login { max-width: 380px; margin: 60px auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
    td.n, th.n { text-align: right; white-space: nowrap; }
    .scroll { overflow-x: auto; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .msg { margin: 8px 0; } a { color: var(--acc); }
    .tabs { display: flex; gap: 8px; margin: 0 0 16px; }
    .tabs a { padding: 8px 18px; background: #222; color: var(--txt); text-decoration: none; font-weight: 600; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
    .tabs a.on { background: var(--acc); color: #000; }
    .meter { height: 10px; background: #2a2a2a; margin-top: 14px; overflow: hidden; } .meter.thin { height: 8px; margin: 0; } .meter span { display: block; height: 100%; }
    .co { display: flex; gap: 10px; align-items: center; } .logo { width: 36px; height: 36px; object-fit: contain; background: #fff1; flex: none; }
    .logo.ph { display: grid; place-items: center; background: var(--acc); color: #000; font-weight: 700; }
    .crumbs { font-weight: 600; } .crumbs a { color: var(--txt); text-decoration: none; } .crumbs a:hover { color: var(--acc); }
    .drop.over { outline: 2px dashed var(--acc); outline-offset: -6px; }
    .up { display: flex; gap: 10px; align-items: center; margin: 4px 0; } .up > span { min-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button.sm, .btn.sm { padding: 5px 12px; font-size: 13px; }
    pre.code { background: #111; border: 1px solid var(--line); padding: 10px 12px; overflow-x: auto; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; }
    td a { color: var(--txt); } td a:hover { color: var(--acc); }
    select.sel { padding: 7px 10px; background: #111; color: var(--txt); border: 1px solid var(--line); font: inherit; font-size: 13px; }
    .access { background: #151515; border: 1px solid var(--line); padding: 12px 14px; margin: 4px 0 8px; }
    .acc-folders { margin-top: 10px; max-height: 340px; overflow-y: auto; }
    .acc-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid #222; font-size: 14px; } .acc-row.sub { padding-left: 18px; color: var(--dim); }
    button.on { background: var(--acc); color: #000; }
    .pill { display: inline-block; padding: 1px 8px; background: #2a2a2a; font-size: 12px; margin: 0 4px 4px 0; }
  </style>
</head>
<body>
  <header><img src="/brand/rfp-logo-sm.png" alt="RFP"><div class="grow">Universe</div><div id="who" class="small dim"></div></header>
  <main id="main"><p class="dim">Loading…</p></main>
  <footer id="foot" class="small dim" style="text-align:center;padding:10px 16px 30px"></footer>
  <script src="/js/super.js"></script>
</body>
</html>
