<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch</title>
  <link rel="icon" type="image/png" href="/icons/favicon-64.png">
  <style>
    :root { --bg: #111; --panel: #1b1b1b; --line: #333; --text: #f2f2f2; --dim: #a3a3a3; --live: #ff3b3b; --accent: #00ff82; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .stage { position: relative; background: #000; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; display: grid; place-items: center; }
    .stage video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
    .stage .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .45; }
    .msg { position: relative; text-align: center; padding: 24px; max-width: 460px; }
    .msg p { color: var(--dim); margin: 6px 0 0; }
    .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 0 6px; }
    h1 { font-size: 22px; margin: 0; flex: 1; min-width: 0; }
    .badge { font-size: 12px; font-weight: 700; letter-spacing: .08em; padding: 3px 9px; border-radius: 4px; background: #333; color: var(--dim); }
    .badge.on { background: var(--live); color: #fff; }
    .dim { color: var(--dim); } .small { font-size: 13px; }
    .desc { white-space: pre-wrap; color: var(--dim); margin: 8px 0 0; }
    button, .btn { font: inherit; color: var(--text); background: #2b2b2b; border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
    button.primary, .btn.primary { background: var(--accent); color: #0b0b0b; border-color: var(--accent); font-weight: 600; }
    input { font: inherit; color: var(--text); background: #0d0d0d; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; margin: 12px 0 8px; }
    .player.has-bar .stage { border-radius: 10px 10px 0 0; }
    .slate { position: absolute; inset: 0; z-index: 3; display: grid; place-content: center; justify-items: center; gap: 6px; text-align: center; padding: 24px;
      background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--accent) 30%, #161616), #050505 72%); }
    /* a hint of colour bars behind it: faint bars across the top, a thin full-strength strip along the bottom */
    .slate::before, .slate::after { content: ''; position: absolute; left: 0; right: 0; pointer-events: none;
      background: linear-gradient(90deg, #c0c0c0 0 14.28%, #c0c000 0 28.57%, #00c0c0 0 42.85%, #00c000 0 57.14%, #c000c0 0 71.42%, #c00000 0 85.71%, #0000c0 0); }
    .slate::before { top: 0; height: 66%; opacity: .1; -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent); }
    .slate::after { bottom: 0; height: 5px; opacity: .55; }
    .slate > * { position: relative; }
    .slate b { font-size: clamp(20px, 4vw, 34px); letter-spacing: .02em; }
    .slate p { margin: 0; color: #cfcfcf; max-width: 520px; font-size: clamp(13px, 2vw, 16px); }
    .slate .slogo { width: clamp(72px, 14vw, 140px); height: clamp(72px, 14vw, 140px); object-fit: contain; border-radius: 50%; background: rgba(0,0,0,.35); margin-bottom: 10px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 70%, transparent), 0 10px 30px rgba(0,0,0,.5); }
    .slate .slogo.brand { width: clamp(120px, 22vw, 220px); height: auto; border-radius: 0; background: none; box-shadow: none; }
    .slate .sbars { display: flex; gap: 6px; margin-top: 14px; }
    .slate .sbars i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: sb 1.2s infinite ease-in-out; }
    .slate .sbars i:nth-child(2) { animation-delay: .15s; } .slate .sbars i:nth-child(3) { animation-delay: .3s; }
    @keyframes sb { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.15); } }
    /* master control: slates, ad breaks and graphics over the live picture (this player only) */
    .mcr { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
    .mcr .slate { z-index: 1; } .mcr .slate .suntil { color: #bdbdbd; margin-top: 6px; font-size: 13px; }
    .mcr .adbox { position: absolute; inset: 0; z-index: 3; background: #000; pointer-events: auto; }
    .mcr .advid { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
    .mcr .adbadge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,.72); color: #fff; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 4px; border-left: 3px solid var(--accent); font-variant-numeric: tabular-nums; }
    .mcr .ovl { position: absolute; inset: 0; z-index: 2; }
    .mcr .ov { position: absolute; }
    .mcr .tl { top: 4%; left: 3%; } .mcr .tr { top: 4%; right: 3%; } .mcr .bl { bottom: 14%; left: 3%; } .mcr .br { bottom: 14%; right: 3%; }
    .mcr .bug { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: clamp(11px, 1.6vw, 16px); letter-spacing: .06em; text-shadow: 0 1px 3px rgba(0,0,0,.8); opacity: .92; }
    .mcr .bug img { height: clamp(24px, 5vw, 56px); width: auto; }
    .mcr .bug span { background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 3px; }
    .mcr .lower { left: 4%; bottom: 13%; max-width: 70%; display: grid; background: rgba(10,10,10,.82); border-left: 5px solid var(--accent); padding: 6px 14px; animation: lin .4s ease-out; }
    .mcr .lower.right { left: auto; right: 4%; border-left: 0; border-right: 5px solid var(--accent); text-align: right; }
    .mcr .lower b { font-size: clamp(14px, 2.4vw, 26px); } .mcr .lower span { color: #cfcfcf; font-size: clamp(11px, 1.6vw, 17px); }
    @keyframes lin { from { opacity: 0; transform: translateY(12px); } }
    .mcr .ticker { left: 0; right: 0; bottom: 0; height: clamp(22px, 3.6vw, 36px); background: rgba(8,8,8,.85); border-top: 2px solid var(--accent); overflow: hidden; display: flex; align-items: center; }
    .mcr .ticker .tk { white-space: nowrap; padding-left: 100%; animation: tick 22s linear infinite; font-weight: 600; font-size: clamp(11px, 1.7vw, 17px); }
    @keyframes tick { to { transform: translateX(-100%); } }
    .mcr .image { max-width: 30%; max-height: 30%; object-fit: contain; }
    .player.has-bar .mcr .ticker { bottom: 0; }
    /* squeeze-back: the live picture in a corner, the advert or sponsor board behind it */
    .stage .sqbg { position: absolute; inset: 0; z-index: 0; background: #000; }
    .stage .sqbg img, .stage .sqbg video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .stage .sqbg .sqtext { position: absolute; left: 3%; bottom: 18%; max-width: 30%; font-weight: 800; font-size: clamp(14px, 2.6vw, 30px); text-shadow: 0 2px 8px rgba(0,0,0,.8); }
    .stage > video:not(.advid) { transition: all .6s cubic-bezier(.2,.8,.2,1); }
    .stage.squeeze > video:not(.advid) { z-index: 1; inset: auto; width: var(--sq, 62%); height: var(--sq, 62%); box-shadow: 0 0 0 3px var(--accent), 0 10px 30px rgba(0,0,0,.6); border-radius: 6px; }
    .stage.sq-tr > video:not(.advid) { top: 4%; right: 3%; } .stage.sq-tl > video:not(.advid) { top: 4%; left: 3%; }
    .stage.sq-br > video:not(.advid) { bottom: 4%; right: 3%; } .stage.sq-bl > video:not(.advid) { bottom: 4%; left: 3%; }
    .mcr .sqbadge { top: auto; bottom: 10px; right: auto; left: 10px; }
    .unmute { position: absolute; left: 12px; bottom: 12px; z-index: 2; background: rgba(0,0,0,.7); }
    .err { color: #ff8a8a; }
    .msg a { color: var(--accent); }
    .msg .col { display: grid; gap: 8px; margin: 14px 0 4px; } .msg .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; } .msg .small { font-size: 12px; }
    .msg .col input { margin: 0; box-sizing: border-box; }
    .bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; max-width: 1100px; margin: 0 auto; }
    .bar img { height: 28px; } .bar a { color: var(--text); text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .chrow { display: flex; align-items: center; gap: 12px; margin: 10px 0; flex-wrap: wrap; }
    .chrow a { color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 10px; }
    .chrow .logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #222; }
    .chrow .sp { flex: 1; }
    button.sub { background: var(--text); color: #111; border-color: var(--text); border-radius: 18px; font-weight: 600; } button.sub.on { background: #2b2b2b; color: var(--text); border-color: var(--line); }
    .vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
    .vids a { display: block; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--text); text-decoration: none; }
    .vids a.on { border-color: var(--accent); } .vids small { color: var(--dim); display: block; }
    #chat { margin-top: 18px; } #chat h3 { margin: 0 0 8px; font-size: 16px; }
    .clist { max-height: 360px; overflow-y: auto; display: grid; gap: 10px; padding: 4px 2px 8px; }
    .cm { display: flex; gap: 10px; align-items: flex-start; } .cm .av { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: none; background: #2b2b2b; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--dim); }
    .cm b { font-size: 13px; } .cm .t { white-space: pre-wrap; word-break: break-word; } .cm .when { color: var(--dim); font-size: 12px; margin-left: 6px; }
    .cm .rm { background: none; border: 0; color: var(--dim); padding: 0 4px; font-size: 12px; cursor: pointer; }
    .cform { display: flex; gap: 8px; } .cform input { margin: 0; flex: 1; }
    @media (max-width: 600px) { main { padding: 0 0 16px; } .stage { border-radius: 0; } .info { padding: 0 16px; } }
  </style>
</head>
<body>
  <div class="bar"><a href="/"><img src="/brand/rfp-logo-sm.png" alt="RFP"><span id="site">RegemarkFP</span></a></div>
  <main>
    <div class="player" id="player"><div class="stage" id="stage"><div class="msg"><b>Loading…</b></div></div><div id="ctrl"></div></div>
    <div class="info">
      <div class="head"><h1 id="title"></h1><span class="badge" id="badge">OFFLINE</span><span class="dim small" id="viewers"></span></div>
      <div class="chrow" id="chrow"></div>
      <div class="desc" id="desc"></div>
      <div id="chat"></div>
      <div id="vids"></div>
    </div>
  </main>
  <script src="/js/vendor/hls.min.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/watch.js"></script>
</body>
</html>
