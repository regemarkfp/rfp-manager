# Render blueprint for the online site. New > Blueprint, pick this repository, then fill in the two secrets.
services:
  - type: web
    name: rfp-manager
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node --disable-warning=ExperimentalWarning server.js
    healthCheckPath: /healthz
    envVars:
      - key: MODE
        value: cloud
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: rfpmanager
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SITE_ADMINS
        sync: false
      # email notifications (optional): MAIL_PROVIDER = brevo or resend, MAIL_FROM, MAIL_API_KEY
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_API_KEY
        sync: false
