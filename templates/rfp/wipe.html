<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CricketCG Wipe</title>
<link rel="stylesheet" href="lib/cgx.css">
<style>
  #w { position: absolute; inset: 0; overflow: hidden; }
  .band { position: absolute; left: -400px; right: -400px; top: 380px; height: 320px; transform: skewY(-6deg) translateX(-2400px);
          background: linear-gradient(90deg, var(--c1), var(--c2)); box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .band2 { top: 360px; height: 20px; background: #fff; opacity: .9; }
  .txt { position: absolute; left: 0; right: 0; top: 390px; text-align: center; font-size: 250px; font-weight: 900; letter-spacing: .06em; font-style: italic;
         color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,.4); transform: translateX(2200px); }
  .sub { position: absolute; left: 0; right: 0; top: 720px; text-align: center; font-size: 56px; font-weight: 800; letter-spacing: .08em; opacity: 0; }
  .cg-in .band { animation: sweep 2.8s cubic-bezier(.2,.9,.2,1) forwards; }
  .cg-in .band2 { animation: sweep 2.8s cubic-bezier(.2,.9,.2,1) .08s forwards; }
  .cg-in .txt { animation: txt 2.8s cubic-bezier(.2,.9,.2,1) .1s forwards; }
  .cg-in .sub { animation: sub 2.8s ease .35s forwards; }
  @keyframes sweep { 0% { transform: skewY(-6deg) translateX(-2400px); } 25%, 72% { transform: skewY(-6deg) translateX(0); } 100% { transform: skewY(-6deg) translateX(2400px); } }
  @keyframes txt { 0% { transform: translateX(2200px); } 25%, 72% { transform: translateX(0); } 100% { transform: translateX(-2400px); } }
  @keyframes sub { 0% { opacity: 0; } 20%, 65% { opacity: 1; } 80%, 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="w" style="--c1:#1d7be0;--c2:#0b1a33">
  <div class="band"></div><div class="band band2"></div>
  <div class="txt upper" data-f="text"></div>
  <div class="sub upper" id="sub"></div>
</div>
<script src="lib/cgx.js"></script>
<script>
  window.CGX_DEMO = { type: 'SIX', text: 'SIX', player_name: 'MOKOENA', player_runs: '48', player_balls: '30' };
  var colors = { 'FOUR': ['#1d7be0', '#0b1a33'], 'SIX': ['#7b3fe4', '#1a0b33'], 'WICKET': ['#e3262d', '#330b0b'], 'FREE HIT': ['#f4c20d', '#6a4d00'], 'ACE': ['#f4c20d', '#6a4d00'], 'HOME RUN': ['#e3262d', '#330b0b'], 'GRAND SLAM': ['#e3262d', '#330b0b'], 'MATCH': ['#f4c20d', '#6a4d00'] };
  CGX.on('update', function (d) {
    var c = colors[d.type] || [d.team_color1 || d.bat_color1 || '#1d7be0', '#0b1a33'];
    var w = document.getElementById('w');
    w.style.setProperty('--c1', d.bat_color1 && d.type !== 'WICKET' ? c[0] : c[0]);
    w.style.setProperty('--c2', c[1]);
    var sub = '';
    if (d.team_name && !d.player_name) sub = d.team_name;
    if (d.player_name) sub = d.type === 'WICKET' ? d.player_name + '  ' + (d.player_runs || 0) + ' (' + (d.player_balls || 0) + ')' : d.player_name + '  ' + (d.player_runs || 0) + '*';
    document.getElementById('sub').textContent = sub;
  });
</script>
</body>
</html>
