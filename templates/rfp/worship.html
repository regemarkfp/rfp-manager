<!doctype html>
<html><head><meta charset="utf-8"><title>RFP worship</title>
<style>
  /* Worship slides. data.layout: full | lower | name | media | logo | blank
     Keys: text (lines separated by line breaks) or line1…, label, caption, footer, image, bg_image, bg_color, text_color,
           font, align (left|center|right), upper, size (percent), shadow, lower_color, lower_opacity, accent, logo */
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: 'Segoe UI', system-ui, Arial, sans-serif; color: #fff; --accent: #00ff82; }
  .layer { position: absolute; inset: 0; opacity: 0; transition: opacity .28s ease; }
  .layer.on { opacity: 1; }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  /* full screen */
  .full .box { position: absolute; left: 110px; right: 110px; top: 90px; bottom: 150px; display: flex; flex-direction: column; justify-content: center; }
  .full .label { font-size: 30px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; margin-bottom: 18px; }
  .full .text { font-weight: 700; line-height: 1.22; white-space: pre-line; }
  .full .caption { position: absolute; left: 110px; right: 110px; bottom: 92px; font-size: 36px; font-weight: 600; opacity: .92; }
  .full .footer { position: absolute; left: 110px; right: 110px; bottom: 34px; font-size: 21px; opacity: .72; }
  .shadow .text, .shadow .caption, .shadow .label, .shadow .footer { text-shadow: 0 3px 14px rgba(0,0,0,.75), 0 0 3px rgba(0,0,0,.6); }
  /* media */
  .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  /* lower third for the stream */
  .lower .bar { position: absolute; left: 120px; right: 120px; bottom: 70px; padding: 22px 40px 24px; border-radius: 10px; border-bottom: 6px solid var(--accent); transform: translateY(24px); transition: transform .28s ease; }
  .lower.on .bar { transform: none; }
  .lower .text { font-size: 50px; font-weight: 700; line-height: 1.2; white-space: pre-line; }
  .lower .caption { font-size: 26px; opacity: .8; margin-top: 6px; }
  /* name super */
  .name .bar { position: absolute; left: 120px; bottom: 110px; max-width: 1200px; padding: 16px 34px 18px; border-left: 10px solid var(--accent); border-radius: 0 8px 8px 0; transform: translateX(-30px); transition: transform .28s ease; }
  .name.on .bar { transform: none; }
  .name .l1 { font-size: 52px; font-weight: 800; }
  .name .l2 { font-size: 30px; opacity: .85; margin-top: 2px; }
  /* logo */
  .logo { display: flex; align-items: center; justify-content: center; }
  .logo img { max-width: 900px; max-height: 620px; }
  .logo .nm { font-size: 80px; font-weight: 800; }
</style></head>
<body>
<div id="stage"></div>
<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage'), data = {}, playing = false, cur = null;
  function parse(raw) {
    if (!raw) return {};
    if (typeof raw === 'object') return raw;
    raw = String(raw).trim();
    if (raw.charAt(0) === '{') { try { return JSON.parse(raw); } catch (e) { return {}; } }
    if (raw.charAt(0) === '<') {
      var out = {}, nodes = new DOMParser().parseFromString(raw, 'text/xml').getElementsByTagName('componentData');
      for (var i = 0; i < nodes.length; i++) { var d = nodes[i].getElementsByTagName('data')[0]; out[nodes[i].getAttribute('id')] = d ? d.getAttribute('value') || '' : ''; }
      return out;
    }
    return {};
  }
  var el = function (cls, text) { var d = document.createElement('div'); d.className = cls; if (text !== undefined) d.textContent = text; return d; };
  var rgba = function (hex, pct) { var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); var a = Math.max(0, Math.min(100, +pct || 0)) / 100; return m ? 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + a + ')' : 'rgba(0,0,0,' + a + ')'; };
  function textOf(d) {
    if (d.text) return String(d.text);
    var out = [];
    for (var i = 1; i <= 12; i++) if (d['line' + i]) out.push(d['line' + i]);
    return out.join('\n');
  }
  function build(d) {
    var layout = d.layout || 'full', L = el('layer ' + layout + (d.shadow ? ' shadow' : ''));
    L.style.fontFamily = d.font ? "'" + String(d.font).replace(/['"<>]/g, '') + "', 'Segoe UI', system-ui, sans-serif" : '';
    L.style.color = d.text_color || '#ffffff';
    L.style.textAlign = d.align || 'center';
    var text = textOf(d);
    if (d.upper) text = text.toUpperCase();
    if (layout === 'blank') { var b = el('bg'); b.style.background = '#000'; L.appendChild(b); }
    else if (layout === 'logo') {
      var bg = el('bg'); bg.style.background = d.bg_color || '#000'; L.appendChild(bg);
      if (d.logo) { var im = document.createElement('img'); im.src = d.logo; L.appendChild(im); im.style.position = 'relative'; } else { var n = el('nm', d.org_name || ''); n.style.position = 'relative'; L.appendChild(n); }
    } else if (layout === 'media') {
      var mb = el('bg'); mb.style.background = '#000'; L.appendChild(mb);
      if (d.image) { var mi = document.createElement('img'); mi.src = d.image; L.appendChild(mi); }
    } else if (layout === 'lower') {
      var bar = el('bar'); bar.style.background = rgba(d.lower_color || '#000000', d.lower_opacity === undefined || d.lower_opacity === '' ? 70 : d.lower_opacity);
      bar.appendChild(el('text', text));
      if (d.caption) bar.appendChild(el('caption', d.caption));
      L.appendChild(bar);
    } else if (layout === 'name') {
      var nb = el('bar'); nb.style.background = rgba(d.lower_color || '#000000', d.lower_opacity === undefined || d.lower_opacity === '' ? 80 : d.lower_opacity);
      nb.style.textAlign = 'left';
      nb.appendChild(el('l1', d.line1 || '')); if (d.line2) nb.appendChild(el('l2', d.line2));
      L.appendChild(nb);
    } else {
      var fb = el('bg'); fb.style.backgroundColor = d.bg_color || '#000';
      if (d.bg_image) fb.style.backgroundImage = 'url("' + String(d.bg_image).replace(/"/g, '%22') + '")';
      L.appendChild(fb);
      var box = el('box');
      if (d.label) box.appendChild(el('label', d.label));
      var t = el('text', text); box.appendChild(t); L.appendChild(box);
      if (d.caption) L.appendChild(el('caption', d.caption));
      if (d.footer) L.appendChild(el('footer', d.footer));
      L._fit = function () {                                  // largest size that fits the box
        var size = 86 * (Math.max(40, Math.min(200, +d.size || 100)) / 100);
        t.style.fontSize = size + 'px';
        for (var i = 0; i < 40 && (box.scrollHeight > box.clientHeight + 2 || t.scrollWidth > box.clientWidth + 2) && size > 26; i++) { size -= 3; t.style.fontSize = size + 'px'; }
      };
    }
    return L;
  }
  function render() {
    if (data.accent) document.body.style.setProperty('--accent', data.accent);
    var next = build(data), old = cur;
    stage.appendChild(next);
    if (next._fit) next._fit();
    cur = next;
    requestAnimationFrame(function () { requestAnimationFrame(function () { if (playing) next.classList.add('on'); if (old) { old.classList.remove('on'); setTimeout(function () { old.remove(); }, 340); } }); });
  }
  window.update = function (raw) { var d = parse(raw); var same = JSON.stringify(d) === JSON.stringify(data); data = d; if (!same || !cur) render(); };
  window.play = function () { playing = true; if (!cur) render(); else cur.classList.add('on'); };
  window.stop = function () { playing = false; if (cur) cur.classList.remove('on'); };
  window.next = function () {};
  // Browser test: worship.html?demo  or  worship.html#{"layout":"lower","text":"Line one\nLine two"}
  var demo = { layout: 'full', text: 'First line of the song\nSecond line of the song\nThird line\nFourth line', footer: '"Song Title" – Writer  ·  © 2020 Publisher  ·  CCLI Licence No. 000000', bg_color: '#101820', shadow: '1', size: '100' };
  if (location.hash.length > 2) { try { window.update(decodeURIComponent(location.hash.slice(1))); window.play(); } catch (e) { /* ignore */ } }
  else if (/[?&]demo/.test(location.search)) { var m = /[?&]layout=(\w+)/.exec(location.search); if (m) demo.layout = m[1]; demo.line1 = 'Speaker Name'; demo.line2 = 'Title'; window.update(demo); window.play(); }
})();
</script>
</body></html>
